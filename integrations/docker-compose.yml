name: nyc-urban-analytics

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: nyc
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:?TSDB_PASSWORD is not set}
      POSTGRES_DB: nyc_weather
    ports:
      - "127.0.0.1:${TSDB_PORT:-5432}:5432"
    volumes:
      - timescaledb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyc -d nyc_weather"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/nyc_weather.json
      TSDB_READER_PASSWORD: ${TSDB_READER_PASSWORD:?TSDB_READER_PASSWORD is not set}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  timescaledb:
  grafana:
