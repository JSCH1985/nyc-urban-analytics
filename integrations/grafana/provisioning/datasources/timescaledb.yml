apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: grafana_reader
    isDefault: true
    editable: false
    secureJsonData:
      password: ${TSDB_READER_PASSWORD}
    jsonData:
      database: nyc_weather
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
